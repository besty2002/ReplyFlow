services:
  # FastAPI Web Service
  - type: web
    name: replyflow-web
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YAMATO_SITE_ID
        sync: false
      - key: YAMATO_SITE_PASSWORD
        sync: false
      - key: RUN_SYNC_BOT
        value: "false"
  - type: cron
    name: replyflow-sync-cron
    runtime: docker
    plan: starter
    region: singapore
    schedule: "*/10 * * * *"
    dockerCommand: ./start-sync-once.sh
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YAMATO_SITE_ID
        sync: false
      - key: YAMATO_SITE_PASSWORD
        sync: false
      - key: RUN_SYNC_BOT
        value: "false"
